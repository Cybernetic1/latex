           style="font-size:26.6667px;font-family:'Alimama DongFangDaKai';-inkscape-font-specification:'Alimama DongFangDaKai';text-align:start;text-anchor:start"
           id="tspan3009">写给中国人： </tspan><tspan
           style="font-size:37.3333px"
           id="tspan3011">中美文化差异</tspan></tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:300;font-stretch:normal;font-size:4.9389px;font-family:'Alibaba PuHuiTi';-inkscape-font-specification:'Alibaba PuHuiTi Light';white-space:pre;inline-size:120.903;display:inline;fill:#000000;stroke-width:0.264583"
       x="-161.39868"
