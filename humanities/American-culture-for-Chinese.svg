       id="text399"
       transform="translate(203.63891,-8.8102339)"><tspan
         x="-161.39868"
         y="119.47626"
         id="tspan3019"><tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3015">冷战 1.0</tspan> 是美国与苏联的较量，<tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3017">冷战 2.0</tspan> 见证了中国的崛</tspan><tspan
         x="-161.39868"
         y="125.64988"
         id="tspan3021">起，是 中国-俄罗斯-北韩-伊朗 等联盟对抗美国/西方：
</tspan><tspan
         x="-161.39868"
         y="131.8235"
         id="tspan3023">
</tspan><tspan
         x="-161.39868"
         y="137.99713"
         id="tspan3027">一直以来，冷战 包含两个 <tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3025">维度</tspan> (dimensions)：
</tspan><tspan
         x="-161.39868"
         y="144.17076"
         id="tspan3033">x）<tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3029">自由民主</tspan>              <tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3031">专制极权</tspan>
</tspan><tspan
         x="-161.39868"
         y="150.34439"
         id="tspan3039">y）<tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3035">帝国主义</tspan>              <tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3037">反殖民主义</tspan>（帝国的挑战者）
</tspan><tspan
         x="-161.39868"
         y="156.51802"
         id="tspan3041">在 x-维度上，东方阵营 是错的，但在 y-维度上，东方阵</tspan><tspan
         x="-161.39868"
         y="162.69165"
         id="tspan3043">营却是对的。 但西方叙事只强调 x.  不明白这一点，容易</tspan><tspan
         x="-161.39868"
         y="168.86528"
         id="tspan3045">陷入冷战的“泥沼”中。
</tspan><tspan
         x="-161.39868"
         y="175.03891"
         id="tspan3047">要突破 冷战思维，我们必须避免两边的错误，这出路就</tspan><tspan
         x="-161.39868"
         y="181.21254"
         id="tspan3051">是下图中间 浅蓝色那块 (<tspan
   style="font-weight:normal;-inkscape-font-specification:'Alibaba PuHuiTi'"
   id="tspan3049">global egalitarianism</tspan>)：
</tspan><tspan
         x="-161.39868"
         y="187.38617"
         id="tspan3053">
</tspan><tspan
         x="-161.39868"
         y="193.5598"
         id="tspan3055">停留在冷战思维的泥沼中 是没有出路，因为两边的谬误 </tspan><tspan
         x="-161.39868"
         y="199.73343"
         id="tspan3057">其实是同一枚硬币的两面：</tspan></text>
