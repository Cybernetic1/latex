     inkscape:groupmode="layer"
     id="layer1"><text
       xml:space="preserve"
       style="font-size:29.3333px;line-height:1.05;font-family:'Alibaba Sans';-inkscape-font-specification:'Alibaba Sans';text-align:end;text-decoration-color:#000000;letter-spacing:0px;word-spacing:0px;text-anchor:end;white-space:pre;inline-size:451.458;display:inline;fill:#5599ff;stroke-width:0.999999;-inkscape-stroke:none;stop-color:#000000"
       x="-1174.6555"
       y="1935.0198"
       id="text2695"
       transform="matrix(0.26458333,0,0,0.26458333,466.2672,-472.39117)"><tspan
         x="-1174.6555"
         y="1935.0198"
         id="tspan3"><tspan
           style="font-size:37.3333px;font-family:'Alimama DongFangDaKai';-inkscape-font-specification:'Alimama DongFangDaKai';fill:#ff0000"
           id="tspan1">共产主义</tspan><tspan
           style="font-size:37.3333px;font-family:'Alimama DongFangDaKai';-inkscape-font-specification:'Alimama DongFangDaKai'"
           id="tspan2">为什么是错的?</tspan></tspan></text><g
       id="item_0"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,50.665245)"><text
         id="b_0"
         x="65"
         y="0"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_0"
         x="91"
         y="0"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve"><tspan
           x="91"
           y="0"
           id="tspan5">年轻的 <tspan
   style="font-weight:normal"
   id="tspan4">马克斯</tspan> 是个诗人。家境中上，但却挥霍无度，父</tspan><tspan
           x="91"
           y="23.333376"
           id="tspan6">亲给他的零用钱多得惊人，但他每月挥霍殆尽。他同情</tspan><tspan
           x="91"
           y="46.666752"
           id="tspan7">穷人，质疑资本主义的弊病，在这一点上值得敬仰。 他</tspan><tspan
           x="91"
           y="70.000127"
           id="tspan8">不善理财，后来娶了个贵族老婆，但家里一度穷得家徒</tspan><tspan
           x="91"
           y="93.333501"
           id="tspan9">四壁，要向亲戚借钱。晚年，他甚至投资伦敦的股票市</tspan><tspan
           x="91"
           y="116.66688"
           id="tspan10">场！（虽然他仍然致力宣扬共产主义）</tspan></text></g><g
       id="item_1"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,53.840247)"><text
         id="b_1"
         x="65"
         y="142"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_1"
         x="91"
         y="142"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve"><tspan
           x="91"
           y="142"
           id="tspan12">《资本论》并 <tspan
   style="font-weight:normal"
   id="tspan11">没有</tspan> 成功提出反对资本主义的具体经济方</tspan><tspan
           x="91"
           y="165.33338"
           id="tspan14">案。 马克思 对 <tspan
   style="font-weight:normal"
   id="tspan13">经济价值</tspan> 的分析是基于 工人 投入工作的 </tspan><tspan
           x="91"
           y="188.66675"
           id="tspan16"><tspan
   style="font-weight:normal"
   id="tspan15">时钟数</tspan>，这是一种完全过时的、农业社会的观点。 自 </tspan><tspan
           x="91"
           y="212.00013"
           id="tspan18">Adam Smith 开始的现代经济理论，价值是以 <tspan
   style="font-weight:normal"
   id="tspan17">自由市场</tspan></tspan><tspan
           x="91"
           y="235.3335"
           id="tspan19">「看不见的手」决定的。 如果某人发明了一个更好的老</tspan><tspan
           x="91"
           y="258.66688"
           id="tspan20">鼠夹，他就能赚钱，而市场不会计较他用了多少时间去</tspan><tspan
           x="91"
           y="282.00026"
           id="tspan21">想出那个发明。</tspan></text></g><g
       id="item_2"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,50.665245)"><text
         id="b_2"
         x="65"
         y="326"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_2"
         x="91"
         y="326"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve"><tspan
           x="91"
           y="326"
           id="tspan23">Adam Smith 奠定了 <tspan
   style="font-weight:normal"
   id="tspan22">自由竞争</tspan> 的思想，影响了一世纪后 </tspan><tspan
           x="91"
           y="349.33336"
           id="tspan25">达尔文 提出 <tspan
   style="font-weight:normal"
   id="tspan24">进化论</tspan>。 进化论是整个现代生物学的「大一</tspan><tspan
           x="91"
           y="372.66674"
           id="tspan26">统理论」，是主宰生物界的规律。 最近甚至有学者以 进</tspan><tspan
           x="91"
           y="396.00011"
           id="tspan28">化论 解释人类历史发展的 dynamics (cf. <tspan
   style="font-style:italic;font-family:'Adwaita Sans';-inkscape-font-specification:'Adwaita Sans Light'"
   id="tspan27">Guns, Germs </tspan></tspan><tspan
           x="91"
           y="421.01787"
           id="tspan30"><tspan
   style="font-style:italic;font-family:'Adwaita Sans';-inkscape-font-specification:'Adwaita Sans Light'"
   id="tspan29">and Steel</tspan>). 经济上的自由竞争，与进化论的思想融洽。</tspan></text></g><g
       id="item_3"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,49.077744)"><text
         id="b_3"
         x="65"
         y="468"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_3"
         x="91"
         y="468"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve"><tspan
           x="91"
           y="468"
           id="tspan32">很多大陆小分红一听到 <tspan
   style="font-weight:normal"
   id="tspan31">社会达尔文主义</tspan> 立即哇哇大叫。</tspan></text></g><g
       id="item_4"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,49.077744)"><text
         id="b_4"
         x="65"
         y="505"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_4"
         x="91"
         y="505"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve"><tspan
           x="91"
           y="505"
           id="tspan33">食屎 vs 食饭</tspan></text></g><g
       id="item_5"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,49.077744)"><text
         id="b_5"
         x="65"
         y="542"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_5"
         x="91"
         y="542"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve"><tspan
           x="91"
           y="542"
           id="tspan34">人类进化到此，我们能分辨「善恶、美丑」。 而我们倾</tspan><tspan
           x="91"
           y="565.33339"
           id="tspan35">向于奖励真善美。 自由竞争是基于此原理，但它似乎和</tspan><tspan
           x="91"
           y="588.66677"
           id="tspan36">进化论没有直接关系。</tspan></text></g><g
       id="item_6"
       transform="matrix(0.26458333,0,0,0.26458333,22.765043,49.077744)"><text
         id="b_6"
         x="65"
         y="621"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';fill:#000000">🔾</text><text
         id="t_6"
         x="91"
         y="621"
         style="font-weight:300;font-size:18.6667px;font-family:'Alibaba PuHuiTi';inline-size:457px;display:inline;fill:#000000"
         xml:space="preserve" /></g></g></svg>
