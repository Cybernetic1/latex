<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="2.0" width="800px" height="453.0px" viewBox="0 0 800 453.0">
  <g id="item_0">
    <text id="b_0" x="65" y="0.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;">🔾</text>
    <text id="t_0" x="91" y="0.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;; inline-size: 457px;">
      <tspan xml:space="preserve">美国没有 </tspan>
      <tspan font-weight="normal" xml:space="preserve">阶级观念</tspan>
      <tspan xml:space="preserve">，强调人人平等（至少在白人里面），反之中国的阶级观念很重，人们喜欢找借口瞧不起别人，或强调「门当户对」。 美国注重 </tspan>
      <tspan font-weight="normal" xml:space="preserve">social mobility</tspan>
      <tspan xml:space="preserve">，但中国人觉得阶级跃升几乎是不可能的，斤斤计较于最微小的差异，堕入共产主义的「武力推翻阶级」模式。</tspan>
    </text>
  </g>
  <g id="item_1">
    <text id="b_1" x="65" y="121.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;">🔾</text>
    <text id="t_1" x="91" y="121.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;; inline-size: 457px;">
      <tspan xml:space="preserve">中国人的历史观是 </tspan>
      <tspan font-weight="normal" xml:space="preserve">循环的</tspan>
      <tspan xml:space="preserve">，西方的历史观是 </tspan>
      <tspan font-weight="normal" xml:space="preserve">线性</tspan>
      <tspan xml:space="preserve">进化的。中国在 </tspan>
      <tspan font-weight="normal" xml:space="preserve">改朝换代</tspan>
      <tspan xml:space="preserve"> 之后仍然保留同样的阶级森严，他们看不到社会有进化的可能。</tspan>
    </text>
  </g>
  <g id="item_2">
    <text id="b_2" x="65" y="200.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;">🔾</text>
    <text id="t_2" x="91" y="200.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;; inline-size: 457px;">
      <tspan xml:space="preserve">比起同年纪的白人，中国年轻人显得比较幼稚，因为他们习惯了 </tspan>
      <tspan font-weight="normal" xml:space="preserve">服从长辈</tspan>
      <tspan xml:space="preserve">，不善于表达自己的观点。美国人崇尚 </tspan>
      <tspan font-weight="normal" xml:space="preserve">言论自由</tspan>
      <tspan xml:space="preserve"> 和 </tspan>
      <tspan font-weight="normal" xml:space="preserve">理性讨论</tspan>
      <tspan xml:space="preserve">，例如政治上保守派的 Charles Kirk 曾经和一班 OnlyFans 网红讨论 </tspan>
      <tspan font-weight="normal" xml:space="preserve">做鸡</tspan>
      <tspan xml:space="preserve"> 是不是一份可敬的工作；很难想象同样的辩论出现在国内</tspan>
    </text>
  </g>
  <g id="item_3">
    <text id="b_3" x="65" y="342.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;">🔾</text>
    <text id="t_3" x="91" y="342.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;; inline-size: 457px;">
      <tspan xml:space="preserve">性与贞操观念，Me Too，shame 自由、tolerance</tspan>
    </text>
  </g>
  <g id="item_4">
    <text id="b_4" x="65" y="379.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;">🔾</text>
    <text id="t_4" x="91" y="379.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;; inline-size: 457px;">
      <tspan xml:space="preserve">种族歧视</tspan>
    </text>
  </g>
  <g id="item_5">
    <text id="b_5" x="65" y="416.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;">🔾</text>
    <text id="t_5" x="91" y="416.0" style="font-family:'Alibaba PuHuiTi'; font-weight: 300; font-size:14pt; fill:#000000;; inline-size: 457px;">
      <tspan xml:space="preserve">conservatism, Christianity</tspan>
    </text>
  </g>
</svg>